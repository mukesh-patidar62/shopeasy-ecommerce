<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Checkout - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4" style="max-width:520px;">
    <h3 class="mb-3">Checkout</h3>
    <p class="text-muted">Just confirm where this order should be delivered.</p>

    <form th:action="@{/checkout}" method="post">
        <div class="mb-3">
            <label class="form-label">Full Name</label>
            <input type="text" name="shippingName" class="form-control" th:value="${customer.fullName}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Phone Number</label>
            <input type="tel" name="shippingPhone" class="form-control" th:value="${customer.phone}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">Delivery Address</label>
            <textarea name="shippingAddress" class="form-control" rows="3" required th:text="${customer.address}"></textarea>
        </div>
        <button type="submit" class="btn btn-success w-100">Continue to Payment</button>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
