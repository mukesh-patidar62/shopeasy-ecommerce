
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>
<div th:fragment="nav">
  <nav class="navbar navbar-expand-lg sticky-top">
    <div class="container">
      <a class="navbar-brand" href="/">ShopEasy</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu" style="border-color: rgba(251,248,243,0.3);">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navMenu">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="/">Shop</a></li>
          <li class="nav-item" sec:authorize="isAuthenticated()">
            <a class="nav-link" href="/orders">My Orders</a>
          </li>
          <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" href="/admin/dashboard">Admin Dashboard</a>
          </li>
          <li class="nav-item" sec:authorize="hasRole('ADMIN')">
            <a class="nav-link" href="/admin/orders">All Orders</a>
          </li>
        </ul>
        <ul class="navbar-nav align-items-lg-center">
          <li class="nav-item" sec:authorize="!isAuthenticated()">
            <a class="nav-link" href="/login">Login</a>
          </li>
          <li class="nav-item" sec:authorize="!isAuthenticated()">
            <a class="btn btn-primary btn-sm ms-lg-2" href="/register">Sign up</a>
          </li>
          <li class="nav-item" sec:authorize="isAuthenticated()">
            <a class="nav-link" href="/cart">Cart</a>
          </li>
          <li class="nav-item" sec:authorize="isAuthenticated()">
            <form th:action="@{/logout}" method="post" class="d-inline">
              <button type="submit" class="btn btn-link nav-link">Logout</button>
            </form>
          </li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Floating AI chat widget - lives inside this same fragment so it renders on every page -->
  <div id="chatWidget" style="position:fixed; bottom:24px; right:24px; z-index:2000;">
    <button id="chatToggle" class="btn btn-primary rounded-circle shadow" style="width:60px; height:60px; font-size:24px;">💬</button>

    <div id="chatBox" class="card shadow" style="display:none; position:absolute; bottom:70px; right:0; width:320px; height:420px;">
      <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
        <span>Shop Assistant</span>
        <button id="chatClose" class="btn-close btn-close-white" style="font-size:12px;"></button>
      </div>
      <div id="chatMessages" class="card-body" style="overflow-y:auto; flex:1;"></div>
      <div class="card-footer p-2">
        <form id="chatForm" class="d-flex gap-2">
          <input id="chatInput" type="text" class="form-control form-control-sm" placeholder="Ask about products..." autocomplete="off">
          <button type="submit" class="btn btn-sm btn-primary">➤</button>
        </form>
      </div>
    </div>
  </div>

  <script th:if="${true}">
    (function () {
      const toggle = document.getElementById('chatToggle');
      const box = document.getElementById('chatBox');
      const closeBtn = document.getElementById('chatClose');
      const form = document.getElementById('chatForm');
      const input = document.getElementById('chatInput');
      const messages = document.getElementById('chatMessages');

      // Avoid attaching duplicate listeners if this script somehow runs more than once
      if (toggle.dataset.wired) return;
      toggle.dataset.wired = 'true';

      toggle.addEventListener('click', () => box.style.display = box.style.display === 'none' ? 'flex' : 'none');
      closeBtn.addEventListener('click', () => box.style.display = 'none');

      function addMessage(text, sender) {
        const div = document.createElement('div');
        div.className = 'mb-2 small ' + (sender === 'user' ? 'text-end' : '');
        const bubble = document.createElement('span');
        bubble.className = 'd-inline-block p-2 rounded ' + (sender === 'user' ? 'bg-primary text-white' : 'bg-light');
        bubble.style.maxWidth = '85%';
        bubble.textContent = text;
        div.appendChild(bubble);
        messages.appendChild(div);
        messages.scrollTop = messages.scrollHeight;
      }

      addMessage("Hi! Ask me about our products, prices, or anything else.", 'bot');

      form.addEventListener('submit', async function (e) {
        e.preventDefault();
        const text = input.value.trim();
        if (!text) return;
        addMessage(text, 'user');
        input.value = '';
        addMessage('Typing...', 'bot');

        try {
          const res = await fetch('/api/chat', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message: text })
          });
          const data = await res.json();
          messages.lastChild.remove();
          addMessage(data.reply, 'bot');
        } catch (err) {
          messages.lastChild.remove();
          addMessage("Something went wrong. Please try again.", 'bot');
        }
      });
    })();
  </script>
</div>
</body>
</html>
