<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Payment - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-5 text-center" style="max-width:480px;">
    <h3 class="mb-3">Complete Your Payment</h3>
    <p>Order #<span th:text="${order.id}"></span></p>
    <h4 class="price-tag mb-4">₹<span th:text="${order.totalAmount}"></span></h4>

    <button id="payBtn" class="btn btn-primary btn-lg">Pay Now</button>
    <p id="statusMsg" class="mt-3 text-muted"></p>
</div>

<script src="https://checkout.razorpay.com/v1/checkout.js"></script>
<script th:inline="javascript">
    const orderId = /*[[${order.id}]]*/ 0;

    document.getElementById('payBtn').addEventListener('click', async function () {
        const statusMsg = document.getElementById('statusMsg');
        statusMsg.textContent = 'Setting up secure payment...';

        try {
            const createRes = await fetch('/api/payment/create-order/' + orderId, { method: 'POST' });
            if (!createRes.ok) throw new Error('Could not create payment order');
            const data = await createRes.json();

            const options = {
                key: data.keyId,
                amount: data.amount,
                currency: data.currency,
                name: 'ShopEasy',
                description: 'Order #' + orderId,
                order_id: data.razorpayOrderId,
                handler: async function (response) {
                    statusMsg.textContent = 'Verifying payment...';
                    const verifyRes = await fetch('/api/payment/verify', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            razorpay_order_id: response.razorpay_order_id,
                            razorpay_payment_id: response.razorpay_payment_id,
                            razorpay_signature: response.razorpay_signature,
                            orderId: orderId
                        })
                    });
                    const verifyData = await verifyRes.json();
                    if (verifyData.success) {
                        window.location.href = '/order-success/' + orderId;
                    } else {
                        statusMsg.textContent = 'Payment verification failed. Please try again.';
                    }
                },
                theme: { color: '#198754' }
            };

            const rzp = new Razorpay(options);
            rzp.on('payment.failed', function () {
                statusMsg.textContent = 'Payment failed. Please try again.';
            });
            rzp.open();
            statusMsg.textContent = '';
        } catch (err) {
            statusMsg.textContent = 'Something went wrong: ' + err.message;
        }
    });
</script>
</body>
</html>
