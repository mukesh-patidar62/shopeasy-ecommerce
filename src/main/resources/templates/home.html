<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ShopEasy - Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4">
    <h2 class="mb-4">All Products</h2>
    <div th:if="${#lists.isEmpty(products)}" class="alert alert-info">
        No products yet. Log in as admin to add some!
    </div>
    <div class="row g-3">
        <div class="col-6 col-md-4 col-lg-3" th:each="product : ${products}">
            <div class="card product-card shadow-sm">
                <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" class="card-img-top" alt="product image">
                <div th:unless="${product.imageUrl}" class="product-image-placeholder d-flex align-items-center justify-content-center text-muted">No image</div>
                <div class="card-body d-flex flex-column">
                    <h6 class="card-title" th:text="${product.name}">Product name</h6>
                    <p class="price-tag mb-1" th:text="'₹' + ${product.price}">₹0</p>
                    <p class="small text-muted mb-2" th:text="${product.stock > 0} ? ('In stock: ' + ${product.stock}) : 'Out of stock'">Stock</p>
                    <a th:href="@{'/products/' + ${product.id}}" class="btn btn-outline-primary btn-sm mt-auto">View</a>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
