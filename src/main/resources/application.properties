spring.application.name=ecommerce-app
server.port=${PORT:8080}



spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:ecommercedb;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

app.upload.dir=uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:YOUR_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY:YOUR_API_KEY}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:YOUR_API_SECRET}

razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:YOUR_WEBHOOK_SECRET}

# File upload (product images)
# Stored OUTSIDE the classpath (in an "uploads" folder next to where you run
# the app) so uploaded images persist and are served correctly even when
# packaged as a jar. See WebConfig.java for the /uploads/** mapping.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads

app.admin.email=${ADMIN_EMAIL:admin@shop.com}
app.admin.password=${ADMIN_PASSWORD:admin123} 

gemini.api.key=${GEMINI_API_KEY:YOUR_GEMINI_KEY_HERE} 

# --- Gmail SMTP (order confirmation emails) ---
# Use a Gmail App Password, not your real Gmail password:
# https://myaccount.google.com/apppasswords (requires 2FA enabled on the account)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${GMAIL_USERNAME:your-email@gmail.com}
spring.mail.password=${GMAIL_APP_PASSWORD:your-app-password}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ---------------------------------------------------------------------------
# RAZORPAY CONFIG
# Sign up free at https://dashboard.razorpay.com -> Settings -> API Keys
# These are TEST keys to start with - replace with your own.
# ---------------------------------------------------------------------------
razorpay.key.id=rzp_test_YOUR_KEY_ID
razorpay.key.secret=YOUR_KEY_SECRET
