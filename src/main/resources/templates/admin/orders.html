<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>All Orders - ShopEasy Admin</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4">
    <h3 class="mb-4">All Customer Orders</h3>
    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">No orders placed yet.</div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(orders)}">
        <table class="table table-responsive-cards align-middle">
            <thead>
            <tr><th>Order #</th><th>Customer</th><th>Phone</th><th>Address</th><th>Total</th><th>Status</th><th>Date</th></tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td data-label="Order #" th:text="${order.id}"></td>
                <td data-label="Customer" th:text="${order.shippingName}"></td>
                <td data-label="Phone" th:text="${order.shippingPhone}"></td>
                <td data-label="Address" th:text="${order.shippingAddress}"></td>
                <td data-label="Total" th:text="'₹' + ${order.totalAmount}"></td>
                <td data-label="Status">
                    <span class="badge"
                          th:classappend="${order.status.name() == 'PAID'} ? 'bg-success' : (${order.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-danger')"
                          th:text="${order.status}"></span>
                </td>
                <td data-label="Date" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}"></td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
