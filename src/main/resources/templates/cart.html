<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Your Cart - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4">
    <h3 class="mb-4">Your Cart</h3>

    <div th:if="${#maps.isEmpty(items)}" class="alert alert-info">
        Your cart is empty. <a href="/">Continue shopping</a>.
    </div>

    <div th:unless="${#maps.isEmpty(items)}">
        <div class="table-responsive">
            <table class="table align-middle">
                <thead>
                <tr><th>Product</th><th>Price</th><th>Qty</th><th>Subtotal</th><th></th></tr>
                </thead>
                <tbody>
                <tr th:each="entry : ${items}">
                    <td th:text="${entry.key.name}">Product</td>
                    <td th:text="'₹' + ${entry.key.price}">₹0</td>
                    <td th:text="${entry.value}">1</td>
                    <td th:text="'₹' + ${entry.key.price * entry.value}">₹0</td>
                    <td>
                        <form th:action="@{'/cart/remove/' + ${entry.key.id}}" method="post">
                            <button class="btn btn-sm btn-outline-danger" type="submit">Remove</button>
                        </form>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
        <h5>Total: <span class="price-tag" th:text="'₹' + ${total}">₹0</span></h5>
        <a href="/checkout" class="btn btn-success">Proceed to Checkout</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
