<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add / Edit Product - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4" style="max-width:560px;">
    <h3 class="mb-3" th:text="${product.id} != null ? 'Edit Product' : 'Add New Product'">Add Product</h3>

    <form th:action="@{/admin/products/save}" method="post" enctype="multipart/form-data">
        <input type="hidden" name="id" th:value="${product.id}" th:if="${product.id != null}">

        <div class="mb-3">
            <label class="form-label">Product Name</label>
            <input type="text" name="name" class="form-control" th:value="${product.name}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea id="descriptionField" name="description" class="form-control" rows="3" th:text="${product.description}"></textarea>
            <button type="button" id="generateBtn" class="btn btn-sm btn-outline-primary mt-2">✨ Generate with AI</button>
            <span id="genStatus" class="small text-muted ms-2"></span>
        </div>

        <script>
            document.getElementById('generateBtn').addEventListener('click', async function () {
                const name = document.querySelector('input[name="name"]').value;
                const category = document.querySelector('input[name="category"]').value;
                const status = document.getElementById('genStatus');

                if (!name) {
                    status.textContent = 'Enter a product name first.';
                    return;
                }

                status.textContent = 'Generating...';
                try {
                    const res = await fetch('/admin/products/generate-description?name=' + encodeURIComponent(name) + '&category=' + encodeURIComponent(category), {
                        method: 'POST'
                    });
                    const data = await res.json();
                    document.getElementById('descriptionField').value = data.description;
                    status.textContent = '';
                } catch (err) {
                    status.textContent = 'Generation failed. Try again.';
                }
            });
        </script>

        <div class="row">
            <div class="col-6 mb-3">
                <label class="form-label">Price (₹)</label>
                <input type="number" step="0.01" name="price" class="form-control" th:value="${product.price}" required>
            </div>
            <div class="col-6 mb-3">
                <label class="form-label">Stock Quantity</label>
                <input type="number" name="stock" class="form-control" th:value="${product.stock}" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Category</label>
            <input type="text" name="category" class="form-control" th:value="${product.category}" placeholder="e.g. Electronics, Clothing">
        </div>

        <div class="mb-3">
            <label class="form-label">Product Photo</label>
            <!-- capture="environment" opens the phone's rear camera directly when tapped on mobile -->
            <input type="file" name="imageFile" accept="image/*" capture="environment" class="form-control">
            <div th:if="${product.imageUrl}" class="mt-2">
                <small class="text-muted">Current photo:</small><br>
                <img th:src="${product.imageUrl}" style="max-height:120px;" class="rounded border mt-1">
            </div>
        </div>

        <button type="submit" class="btn btn-success w-100">Save Product</button>
        <a href="/admin/dashboard" class="btn btn-outline-secondary w-100 mt-2">Cancel</a>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
