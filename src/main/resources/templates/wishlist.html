
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Wishlist - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4">
    <h3 class="section-heading">My Wishlist</h3>

    <div th:if="${#lists.isEmpty(items)}" class="alert" style="background: var(--paper-raised); border: 1px dashed var(--line);">
        Nothing saved yet. Tap the heart on any product to save it here for later.
    </div>

    <div class="row g-3">
        <div class="col-6 col-md-4 col-xl-3" th:each="item : ${items}">
            <div class="card product-card">
                <div class="product-img-wrap">
                    <img th:if="${item.product.imageUrl}" th:src="${item.product.imageUrl}" alt="product image">
                    <img th:unless="${item.product.imageUrl}" th:src="'https://picsum.photos/seed/' + ${#strings.replace(item.product.name,' ','-')} + '/400/300'" alt="product image">
                </div>
                <div class="card-body d-flex flex-column">
                    <h6 class="card-title" th:text="${item.product.name}">Name</h6>
                    <span class="price-tag mb-2" th:text="'₹' + ${item.product.price}">₹0</span>
                    <div class="d-flex gap-2 mt-auto">
                        <a th:href="@{'/products/' + ${item.product.id}}" class="btn btn-outline-primary btn-sm flex-fill">View</a>
                        <form th:action="@{'/wishlist/remove/' + ${item.product.id}}" method="post" class="flex-fill">
                            <button type="submit" class="btn btn-sm btn-outline-danger w-100">Remove</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
