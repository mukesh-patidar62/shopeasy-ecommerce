
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Admin Dashboard - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4 pb-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
            <span class="hero-eyebrow" style="background: rgba(31,111,99,0.1); border-color: rgba(31,111,99,0.35); color: var(--teal-deep);">Vendor console</span>
            <h2 class="section-heading" style="border: none; margin-bottom: 0;">Manage Products</h2>
        </div>
        <a href="/admin/products/new" class="btn btn-primary d-none d-md-inline-block">+ Add Product</a>
    </div>

    <div th:if="${#lists.isEmpty(products)}" class="alert" style="background: var(--paper-raised); border: 1px dashed var(--line);">
        No products yet. Tap the + button below to add your first one — works great from your phone too.
    </div>

    <div th:if="${!#lists.isEmpty(lowStockProducts)}" class="alert alert-warning mb-4">
        <strong>⚠ Low stock:</strong>
        <span th:each="p, iter : ${lowStockProducts}">
            <a th:href="@{'/admin/products/' + ${p.id} + '/edit'}" th:text="${p.name} + ' (' + ${p.stock} + ' left)'"></a><span th:if="${!iter.last}">, </span>
        </span>
    </div>

    <div class="row g-3">
        <div class="col-6 col-md-4 col-lg-3" th:each="product : ${products}">
            <div class="card product-card">
                <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" class="card-img-top" alt="product image">
                <div th:unless="${product.imageUrl}" class="product-image-placeholder d-flex align-items-center justify-content-center text-muted">No image</div>
                <div class="card-body d-flex flex-column">
                    <h6 class="card-title" th:text="${product.name}">Name</h6>
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="price-tag" th:text="'₹' + ${product.price}">₹0</span>
                        <span class="stock-chip" th:classappend="${product.stock == 0} ? 'out' : (${product.stock <= 5} ? 'out' : 'in')" th:text="'Stock: ' + ${product.stock}">Stock</span>
                    </div>
                    <div class="d-flex gap-2 mt-auto">
                        <a th:href="@{'/admin/products/' + ${product.id} + '/edit'}" class="btn btn-sm btn-outline-primary flex-fill">Edit</a>
                        <form th:action="@{'/admin/products/' + ${product.id} + '/delete'}" method="post" class="flex-fill"
                              onsubmit="return confirm('Delete this product?');">
                            <button type="submit" class="btn btn-sm btn-outline-danger w-100">Delete</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Floating add button, always reachable with a thumb on mobile -->
<a href="/admin/products/new" class="admin-add-btn" title="Add product">+</a>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
