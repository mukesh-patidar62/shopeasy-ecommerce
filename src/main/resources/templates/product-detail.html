
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${product.name}">Product</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4">
    <div class="row g-4">
        <div class="col-md-6">
            <img th:if="${product.imageUrl}" th:src="${product.imageUrl}" class="img-fluid rounded shadow-sm" alt="product image">
            <img th:unless="${product.imageUrl}" th:src="'https://picsum.photos/seed/' + ${#strings.replace(product.name,' ','-')} + '/500/400'" class="img-fluid rounded shadow-sm" alt="product image">
        </div>
        <div class="col-md-6">
            <h2 th:text="${product.name}">Name</h2>
            <p class="text-muted" th:text="${product.category}">Category</p>
            <div class="mb-2" th:if="${!#lists.isEmpty(reviews)}">
                <span class="fw-semibold" th:text="${#numbers.formatDecimal(averageRating, 1, 1)} + ' / 5'">4.5 / 5</span>
                <span class="text-muted small" th:text="'(' + ${#lists.size(reviews)} + ' review' + (${#lists.size(reviews)} > 1 ? 's' : '') + ')'">(3 reviews)</span>
            </div>
            <p class="text-muted small" th:if="${#lists.isEmpty(reviews)}">No reviews yet.</p>
            <div class="d-flex align-items-center gap-2 mb-2 flex-wrap">
                <h4 class="price-tag mb-0" th:text="'₹' + ${product.price}">₹0</h4>
                <span th:if="${product.originalPrice != null and product.originalPrice > product.price}"
                      class="text-muted text-decoration-line-through"
                      th:text="'₹' + ${product.originalPrice}">₹0</span>
            </div>
            <p th:text="${product.description}">Description</p>
            <p class="small" th:text="${product.stock > 0} ? ('In stock: ' + ${product.stock}) : 'Out of stock'"></p>

            <form th:action="@{'/cart/add/' + ${product.id}}" method="post" sec:authorize="hasRole('CUSTOMER')" th:if="${product.stock > 0}">
                <div class="input-group mb-3" style="max-width:200px;">
                    <span class="input-group-text">Qty</span>
                    <input type="number" name="quantity" value="1" min="1" th:max="${product.stock}" class="form-control">
                </div>
                <button class="btn btn-success" type="submit">Add to Cart</button>
            </form>
            <a sec:authorize="!isAuthenticated()" href="/login" class="btn btn-primary">Log in to buy</a>
        </div>
    </div>

    <hr class="my-5">

    <div class="row">
        <div class="col-lg-8">
            <h4 class="section-heading">Customer Reviews</h4>

            <div th:if="${#lists.isEmpty(reviews)}" class="text-muted">
                Be the first to review this product — reviews are only from customers who've actually purchased it.
            </div>

            <div th:each="review : ${reviews}" class="mb-3 pb-3" style="border-bottom: 1px solid var(--line);">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <strong th:text="${review.customer.fullName}">Customer name</strong>
                    <span class="mono small" th:text="${review.rating} + ' / 5'">5 / 5</span>
                </div>
                <p class="mb-1" th:text="${review.comment}">Review comment</p>
                <p class="small text-muted mb-0" th:text="${#temporals.format(review.createdAt, 'dd MMM yyyy')}"></p>
            </div>

            <!-- Only shown to customers who purchased this product and haven't already reviewed it -->
            <div th:if="${canReview}" class="mt-4">
                <h6>Write a review</h6>
                <div th:if="${reviewError}" class="alert alert-danger small" th:text="${reviewError}"></div>
                <form th:action="@{'/products/' + ${product.id} + '/reviews'}" method="post">
                    <div class="mb-2">
                        <label class="form-label small">Rating</label>
                        <select name="rating" class="form-select" style="max-width:140px;" required>
                            <option value="5">5 - Excellent</option>
                            <option value="4">4 - Good</option>
                            <option value="3">3 - Okay</option>
                            <option value="2">2 - Not great</option>
                            <option value="1">1 - Poor</option>
                        </select>
                    </div>
                    <div class="mb-2">
                        <label class="form-label small">Comment</label>
                        <textarea name="comment" class="form-control" rows="3" placeholder="What did you think?"></textarea>
                    </div>
                    <button type="submit" class="btn btn-primary btn-sm">Submit Review</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
