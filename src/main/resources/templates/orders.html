
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>My Orders - ShopEasy</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
</head>
<body>
<div th:replace="~{fragments/nav :: nav}"></div>

<div class="container py-4">
    <h3 class="mb-4">My Orders</h3>
    <div th:if="${#lists.isEmpty(orders)}" class="alert alert-info">You haven't placed any orders yet.</div>

    <div class="table-responsive" th:unless="${#lists.isEmpty(orders)}">
        <table class="table table-responsive-cards align-middle">
            <thead>
            <tr><th>Order #</th><th>Date</th><th>Items</th><th>Total</th><th>Payment</th><th>Status</th></tr>
            </thead>
            <tbody>
            <tr th:each="order : ${orders}">
                <td data-label="Order #" th:text="${order.id}"></td>
                <td data-label="Date" th:text="${#temporals.format(order.createdAt, 'dd MMM yyyy, HH:mm')}"></td>
                <td data-label="Items" th:text="${order.items.size()} + ' item(s)'"></td>
                <td data-label="Total" th:text="'₹' + ${order.totalAmount}"></td>
                <td data-label="Payment" th:text="${order.paymentMethod.name() == 'COD'} ? 'Cash on Delivery' : 'Online'"></td>
                <td data-label="Status">
                    <span class="badge"
                          th:classappend="${order.status.name() == 'PAID'} ? 'bg-success' : (${order.status.name() == 'CONFIRMED'} ? 'bg-success' : (${order.status.name() == 'SHIPPED'} ? 'bg-info text-dark' : (${order.status.name() == 'DELIVERED'} ? 'bg-primary' : (${order.status.name() == 'PENDING'} ? 'bg-warning text-dark' : 'bg-danger'))))"
                          th:text="${order.status}"></span>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
